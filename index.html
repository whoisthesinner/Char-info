<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>캐릭터 프로필 메이커</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --accent: #3f9e8e;
    --accent2: #a9812f;
    --danger: #c0503c;
    --dark-bg: #0d1210;
    --light-bg: #f2ede3;
    --text-dark: #1b1b1b;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0 80px;
  }

  /* ---------- 상단 툴바 ---------- */
  .toolbar {
    width: 900px;
    max-width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding: 0 4px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .toolbar .hint { color: #9a9a9a; font-size: 13px; }
  .save-btn {
    background: var(--accent);
    color: #0d1210;
    border: none;
    font-weight: 800;
    font-size: 15px;
    padding: 12px 22px;
    cursor: pointer;
    border-radius: 4px;
  }
  .save-btn:active { opacity: 0.8; }

  .card { width: 900px; max-width: 100%; background: var(--dark-bg); overflow: hidden; }

  .top-bar { height: 14px; background: var(--light-bg); }

  [contenteditable="true"] { outline: none; cursor: text; transition: box-shadow 0.15s; }
  [contenteditable="true"]:hover { box-shadow: 0 0 0 2px rgba(63,158,142,0.6); }
  [contenteditable="true"]:focus { box-shadow: 0 0 0 2px var(--accent); }

  .page-header {
    background: var(--dark-bg); text-align: center; padding: 28px 0 20px;
    border-bottom: 4px solid var(--accent);
  }
  .page-header span { color: #fff; font-size: 26px; font-weight: 800; letter-spacing: 14px; }

  .hero { display: flex; flex-wrap: wrap; }
  .hero-img {
    flex: 1 1 380px;
    min-height: 480px;
    background: #333 center/cover no-repeat;
    position: relative;
  }
  .img-upload-btn {
    position: absolute;
    bottom: 14px; left: 14px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 14px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.4);
  }
  .img-upload-btn input { display: none; }

  .hero-info { flex: 1 1 380px; background: var(--dark-bg); color: #fff; padding: 44px 36px; }
  .hero-info h1 {
    font-size: 44px; line-height: 1.05; margin: 0 0 20px; font-weight: 900;
    text-shadow: 2px 2px 0 var(--accent); white-space: pre-wrap;
  }
  .divider { width: 60px; height: 5px; background: var(--accent); margin-bottom: 20px; }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; align-items: center; }
  .tag-wrap { position: relative; display: inline-flex; align-items: center; }
  .tag {
    padding: 9px 26px 9px 16px;
    font-weight: 700; font-size: 14px;
    border: 2px solid var(--accent); color: var(--accent);
  }
  .tag-remove {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: 14px; font-weight: 900; line-height: 1; padding: 2px;
  }
  .add-tag-btn {
    border: 2px dashed #555; color: #999; background: none;
    padding: 9px 14px; font-size: 14px; cursor: pointer; font-weight: 700;
  }
  .hero-info p { font-size: 16px; line-height: 1.7; color: #e7e7e7; margin: 0; }

  .section { padding: 40px 36px; }
  .section.light { background: var(--light-bg); }
  .section.white { background: #ffffff; }

  .label {
    display: inline-block; background: var(--accent); color: #0d1210;
    font-size: 12px; font-weight: 800; letter-spacing: 3px; padding: 6px 14px;
    margin-bottom: 16px; box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
  }
  .label.gold { background: var(--accent2); }

  .section h2 { font-size: 26px; margin: 0 0 18px; color: var(--text-dark); }
  .section p { font-size: 15px; line-height: 1.8; color: #333; margin: 0 0 14px; }

  .ability {
    position: relative;
    background: #274b44 center/cover no-repeat;
    color: #fff; padding: 44px 36px;
  }
  .ability::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(100deg, rgba(13,18,16,0.92) 30%, rgba(13,18,16,0.35) 100%);
    pointer-events: none;
  }
  .ability > * { position: relative; z-index: 1; }
  .ability .sub-label { color: #d9c07a; font-size: 14px; letter-spacing: 2px; margin-bottom: 6px; }
  .ability .ability-name { font-size: 46px; font-weight: 900; margin: 0 0 18px; }
  .ability p { color: #e7e7e7; }
  .risk-box { border: 2px solid var(--danger); background: rgba(0,0,0,0.3); padding: 20px 22px; margin-top: 22px; }
  .risk-box .label { background: var(--danger); color: #fff; }
  .risk-box p { color: #f1dcd6; margin: 0; }

  @media (max-width: 600px) {
    .hero-img { min-height: 320px; }
    .toolbar { padding: 0 12px; }
  }

  .capturing .toolbar,
  .capturing .img-upload-btn,
  .capturing .tag-remove,
  .capturing .add-tag-btn {
    display: none !important;
  }
</style>
</head>
<body>

  <div class="toolbar">
    <span class="hint">텍스트를 탭하면 수정, 사진 버튼으로 이미지 변경</span>
    <button class="save-btn" onclick="saveAsPng()">PNG로 저장</button>
  </div>

  <div class="card" id="card">

    <div class="top-bar"></div>
    <div class="page-header"><span contenteditable="true">PROFILE</span></div>

    <div class="hero">
      <div class="hero-img" id="portraitImg">
        <label class="img-upload-btn">
          사진 선택
          <input type="file" accept="image/*" onchange="setImage(event, 'portraitImg')">
        </label>
      </div>
      <div class="hero-info">
        <h1 contenteditable="true">CHARACTER
NAME</h1>
        <div class="divider"></div>
        <div class="tags" id="tagList">
          <span class="tag-wrap"><span class="tag" contenteditable="true">00세</span><button class="tag-remove" onclick="this.parentElement.remove()">×</button></span>
          <span class="tag-wrap"><span class="tag" contenteditable="true">성별</span><button class="tag-remove" onclick="this.parentElement.remove()">×</button></span>
          <span class="tag-wrap"><span class="tag" contenteditable="true">소속/직책</span><button class="tag-remove" onclick="this.parentElement.remove()">×</button></span>
          <button class="add-tag-btn" onclick="addTag()">+ 태그</button>
        </div>
        <p contenteditable="true">외형 설명. 키, 체형, 머리색, 눈동자 색, 인상, 평소 옷차림 등을 서술합니다.</p>
      </div>
    </div>

    <div class="section light">
      <span class="label" contenteditable="true">PERSONALITY</span>
      <h2 contenteditable="true">성격</h2>
      <p contenteditable="true">성격 설명을 여기에 적습니다.</p>
    </div>

    <div class="ability" id="abilityBg">
      <label class="img-upload-btn" style="top:14px; bottom:auto;">
        배경 사진 선택
        <input type="file" accept="image/*" onchange="setImage(event, 'abilityBg')">
      </label>
      <span class="label" contenteditable="true">ABILITY</span>
      <div class="sub-label" contenteditable="true">이 능 력</div>
      <div class="ability-name" contenteditable="true">SKILL NAME</div>
      <p contenteditable="true">능력에 대한 설명을 여기에 적습니다.</p>

      <div class="risk-box">
        <span class="label" contenteditable="true">RISK</span>
        <p contenteditable="true">능력의 위험성, 부작용, 한계 등을 여기에 적습니다.</p>
      </div>
    </div>

    <div class="section white">
      <span class="label gold" contenteditable="true">CAREER &amp; DETAILS</span>
      <h2 contenteditable="true">커리어</h2>
      <p contenteditable="true">첫 번째 문단 내용.</p>
      <p contenteditable="true">두 번째 문단 내용.</p>
    </div>

  </div>

<script>
function setImage(event, targetId) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    document.getElementById(targetId).style.backgroundImage =
      "linear-gradient(100deg, rgba(13,18,16,0.92) 30%, rgba(13,18,16,0.35) 100%), url('" + e.target.result + "')";
    // 인물사진(portraitImg)은 그라디언트 없이 순수 이미지로
    if (targetId === 'portraitImg') {
      document.getElementById(targetId).style.backgroundImage = "url('" + e.target.result + "')";
    }
  };
  reader.readAsDataURL(file);
}

function addTag() {
  const wrap = document.createElement('span');
  wrap.className = 'tag-wrap';
  wrap.innerHTML = '<span class="tag" contenteditable="true">새 태그</span><button class="tag-remove" onclick="this.parentElement.remove()">×</button>';
  document.getElementById('tagList').insertBefore(wrap, document.querySelector('.add-tag-btn'));
}

function saveAsPng() {
  const card = document.getElementById('card');
  document.body.classList.add('capturing');

  html2canvas(card, {
    backgroundColor: '#0d1210',
    scale: 2,
    useCORS: true
  }).then(function (canvas) {
    document.body.classList.remove('capturing');
    const link = document.createElement('a');
    link.download = 'character-profile.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(function (err) {
    document.body.classList.remove('capturing');
    alert('저장 중 오류가 발생했어요: ' + err);
  });
}
</script>

</body>
</html>
